name: n8n-workflow
label: n8n Workflow
description: n8n-inspired dark dashboard with restrained orange accents and workflow canvas styling
palette:
  background:
    hex: "#181818"
    alpha: 1
  midground:
    hex: "#f4f4f5"
    alpha: 1
  foreground:
    hex: "#ff6d00"
    alpha: 0.14
  warmGlow: "rgba(255, 109, 0, 0.16)"
  noiseOpacity: 0.28
typography:
  fontSans: '"Inter", "Geist", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  fontMono: '"JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace'
  fontDisplay: '"Inter", "Geist", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;650;700;760&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
  baseSize: "15px"
  lineHeight: "1.55"
  letterSpacing: "0"
layout:
  radius: "0.625rem"
  density: comfortable
layoutVariant: tiled
swatchColors:
  - "#181818"
  - "#f4f4f5"
  - "#ff6d00"
terminalBackground: "#111111"
terminalForeground: "#f4f4f5"
seriesColors:
  inputTokenAccent: "#ff6d00"
  outputTokenAccent: "#00c853"
colorOverrides:
  card: "#242424"
  cardForeground: "#f4f4f5"
  popover: "#242424"
  popoverForeground: "#f4f4f5"
  primary: "#ff6d00"
  primaryForeground: "#1a1008"
  secondary: "#2b2b2b"
  secondaryForeground: "#f4f4f5"
  muted: "#2a2a2a"
  mutedForeground: "#a3a3a3"
  accent: "#333333"
  accentForeground: "#ffffff"
  destructive: "#ff4e61"
  destructiveForeground: "#ffffff"
  success: "#00c853"
  warning: "#ffb84d"
  border: "#343434"
  input: "#343434"
  ring: "#ff6d00"
componentStyles:
  card:
    background: "rgba(36,36,36,0.96)"
    borderColor: "rgba(255,255,255,0.12)"
    boxShadow: "0 12px 34px rgba(0,0,0,0.22)"
  sidebar:
    background: "rgba(38,38,38,0.98)"
    borderColor: "rgba(255,255,255,0.1)"
  header:
    background: "rgba(24,24,24,0.96)"
    borderColor: "rgba(255,255,255,0.1)"
customCSS: |
  :root {
    --n8n-bg: #181818;
    --n8n-sidebar: #262626;
    --n8n-panel: #242424;
    --n8n-panel-2: #2b2b2b;
    --n8n-node: #2d2d2d;
    --n8n-border: rgba(255, 255, 255, 0.12);
    --n8n-border-strong: rgba(255, 255, 255, 0.24);
    --n8n-text: #f4f4f5;
    --n8n-muted: #a3a3a3;
    --n8n-faint: #747474;
    --n8n-orange: #ff6d00;
    --n8n-orange-hover: #ff7a1a;
    --n8n-coral: #ff6d00;
    --n8n-coral-strong: #ff6d00;
    --n8n-green: #00c853;
    --n8n-blue: #6aa9ff;
    --n8n-purple: #a77cff;
  }

  html, body, #root {
    background: var(--n8n-bg) !important;
    color: var(--n8n-text);
    font-family: var(--theme-font-sans);
    letter-spacing: 0;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image: radial-gradient(circle, rgba(255, 255, 255, 0.055) 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: 0.2;
    pointer-events: none;
  }

  #app-sidebar,
  [id="app-sidebar"] {
    background: var(--n8n-sidebar) !important;
    border-color: var(--n8n-border) !important;
    box-shadow: 1px 0 0 rgba(255, 255, 255, 0.04);
  }

  #app-sidebar a,
  #app-sidebar button,
  #app-sidebar [role="button"] {
    border-radius: 8px !important;
    color: rgba(244, 244, 245, 0.74) !important;
    transition: background-color 150ms ease, color 150ms ease, transform 150ms ease;
  }

  #app-sidebar a:hover,
  #app-sidebar button:hover,
  #app-sidebar [role="button"]:hover {
    background: rgba(255, 255, 255, 0.06) !important;
    color: var(--n8n-text) !important;
  }

  main,
  [data-layout-variant="tiled"] main {
    background: transparent !important;
  }

  header,
  [class*="header"],
  [class*="Header"] {
    border-color: var(--n8n-border) !important;
  }

  h1, h2, h3,
  .font-mondwest,
  .text-display {
    font-family: var(--theme-font-display) !important;
    letter-spacing: 0 !important;
    font-weight: 650 !important;
  }

  input,
  textarea,
  select,
  [role="combobox"] {
    border-color: var(--n8n-border) !important;
    background: #181818 !important;
    color: var(--n8n-text) !important;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
  }

  input:focus,
  textarea:focus,
  select:focus,
  [role="combobox"]:focus {
    border-color: var(--n8n-orange) !important;
    box-shadow: 0 0 0 2px rgba(255, 109, 0, 0.18) !important;
  }

  button:not([role="tab"]),
  .btn,
  [class*="Button"] {
    border-radius: 8px !important;
  }

  button:not([role="tab"]):not([aria-label*="Collapse"]):not([aria-label*="theme"]):not([aria-label*="language"]) {
    transition: transform 140ms ease, box-shadow 140ms ease, background-color 140ms ease, border-color 140ms ease;
  }

  button:not([role="tab"]):not([aria-label*="Collapse"]):hover {
    transform: translateY(-1px);
  }

  [role="dialog"],
  [data-radix-popper-content-wrapper] > *,
  [role="menu"],
  [role="listbox"] {
    border-color: var(--n8n-border) !important;
    background: #242424 !important;
    color: var(--n8n-text) !important;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.42) !important;
    backdrop-filter: blur(14px);
  }

  [role="option"]:hover,
  [role="menuitem"]:hover {
    background: rgba(255, 255, 255, 0.06) !important;
  }

  .hermes-kanban {
    color: var(--n8n-text);
  }

  .hermes-kanban .border,
  .hermes-kanban [class*="border-border"] {
    border-color: var(--n8n-border) !important;
  }

  .hermes-kanban-columns {
    gap: 0.9rem;
  }

  .hermes-kanban-column {
    border-color: var(--n8n-border) !important;
    background: #202020 !important;
    box-shadow: none;
  }

  .hermes-kanban-card {
    border-color: var(--n8n-border) !important;
    background: #242424 !important;
    color: var(--n8n-text) !important;
    box-shadow: none;
    transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
  }

  .hermes-kanban-card:hover {
    border-color: var(--n8n-border-strong) !important;
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
  }

  .hermes-kanban-view-toggle {
    border-color: var(--n8n-border) !important;
    background: #181818 !important;
  }

  .hermes-kanban-view-toggle-btn--active {
    background: var(--n8n-orange) !important;
    color: #1a0b08 !important;
    box-shadow: none !important;
  }

  .hermes-kanban-flow {
    border-color: var(--n8n-border) !important;
    background: #181818 !important;
  }

  .hermes-kanban-flow-rail {
    background: #242424 !important;
    border-right-color: var(--n8n-border) !important;
  }

  .hermes-kanban-flow-node {
    border-color: var(--n8n-border-strong) !important;
    background: #2d2d2d !important;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.24) !important;
  }

  .hermes-kanban-flow-node--running {
    border-color: var(--n8n-orange) !important;
    box-shadow: 0 0 0 1px rgba(255, 109, 0, 0.28), 0 8px 22px rgba(0, 0, 0, 0.24) !important;
  }

  html[data-layout-variant="tiled"] {
    --color-card: #242424;
    --color-card-foreground: var(--n8n-text);
    --color-popover: #242424;
    --color-popover-foreground: var(--n8n-text);
    --color-secondary: #2b2b2b;
    --color-muted: #2a2a2a;
    --color-muted-foreground: var(--n8n-muted);
    --color-accent: #333333;
    --color-accent-foreground: var(--n8n-text);
    --color-border: var(--n8n-border);
    --color-input: #343434;
    --color-ring: var(--n8n-orange);
    color-scheme: dark;
  }

  html[data-layout-variant="tiled"] * {
    scrollbar-color: rgba(154, 147, 171, 0.34) transparent;
  }

  html[data-layout-variant="tiled"] ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  html[data-layout-variant="tiled"] ::-webkit-scrollbar-thumb {
    background: rgba(154, 147, 171, 0.28);
    border-radius: 999px;
  }

  html[data-layout-variant="tiled"] ::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 109, 0, 0.55);
  }

  html[data-layout-variant="tiled"] .bg-background,
  html[data-layout-variant="tiled"] [class*="bg-background"] {
    background-color: transparent !important;
  }

  html[data-layout-variant="tiled"] .bg-background-base,
  html[data-layout-variant="tiled"] [class*="bg-background-base"] {
    background-color: rgba(11, 7, 19, 0.86) !important;
  }

  html[data-layout-variant="tiled"] .bg-card,
  html[data-layout-variant="tiled"] [class*="bg-card"],
  html[data-layout-variant="tiled"] [class*="bg-secondary"],
  html[data-layout-variant="tiled"] [class*="bg-muted"] {
    background: #242424 !important;
  }

  html[data-layout-variant="tiled"] .border,
  html[data-layout-variant="tiled"] [class*="border-border"],
  html[data-layout-variant="tiled"] [class*="border-midground"],
  html[data-layout-variant="tiled"] [class*="border-current"] {
    border-color: var(--n8n-border) !important;
  }

  html[data-layout-variant="tiled"] .text-midground,
  html[data-layout-variant="tiled"] [class*="text-midground"] {
    color: var(--n8n-text) !important;
  }

  html[data-layout-variant="tiled"] .text-text-secondary,
  html[data-layout-variant="tiled"] [class*="text-text-secondary"],
  html[data-layout-variant="tiled"] .text-muted-foreground,
  html[data-layout-variant="tiled"] [class*="text-muted-foreground"] {
    color: var(--n8n-muted) !important;
  }

  html[data-layout-variant="tiled"] .text-text-tertiary,
  html[data-layout-variant="tiled"] [class*="text-text-tertiary"] {
    color: var(--n8n-faint) !important;
  }

  html[data-layout-variant="tiled"] a:not(#app-sidebar a) {
    color: #f4f4f5;
    text-decoration-color: rgba(255, 109, 0, 0.36);
    transition: color 140ms ease, text-decoration-color 140ms ease;
  }

  html[data-layout-variant="tiled"] a:not(#app-sidebar a):hover {
    color: #ffffff;
    text-decoration-color: var(--n8n-orange);
  }

  html[data-layout-variant="tiled"] h1,
  html[data-layout-variant="tiled"] h2,
  html[data-layout-variant="tiled"] h3,
  html[data-layout-variant="tiled"] h4 {
    color: #f4f4f5 !important;
  }

  html[data-layout-variant="tiled"] main > div,
  html[data-layout-variant="tiled"] main section,
  html[data-layout-variant="tiled"] [class*="rounded"][class*="border"] {
    border-color: var(--n8n-border) !important;
  }

  html[data-layout-variant="tiled"] main [class*="rounded"][class*="border"]:not(.hermes-kanban-flow):not(.hermes-kanban-flow-node):not(.hermes-kanban-card) {
    background: #242424 !important;
    box-shadow: none;
  }

  html[data-layout-variant="tiled"] button,
  html[data-layout-variant="tiled"] [role="button"] {
    min-height: 2rem;
    border-color: rgba(154, 147, 171, 0.38) !important;
    color: var(--n8n-text);
  }

  html[data-layout-variant="tiled"] button[class*="bg-midground"],
  html[data-layout-variant="tiled"] button[class*="bg-primary"],
  html[data-layout-variant="tiled"] button[class*="text-background"] {
    background: #2b2b2b !important;
    border-color: var(--n8n-border) !important;
    color: var(--n8n-text) !important;
    box-shadow: none;
    font-weight: 600;
  }

  html[data-layout-variant="tiled"] button[class*="bg-midground"]:hover,
  html[data-layout-variant="tiled"] button[class*="bg-primary"]:hover,
  html[data-layout-variant="tiled"] button[class*="text-background"]:hover {
    background: #333333 !important;
    border-color: var(--n8n-border-strong) !important;
    box-shadow: none;
  }

  html[data-layout-variant="tiled"] button[title^="Create a new board"],
  html[data-layout-variant="tiled"] button[type="submit"] {
    background: var(--n8n-orange) !important;
    border-color: var(--n8n-orange) !important;
    color: #1a1008 !important;
    box-shadow: none !important;
  }

  html[data-layout-variant="tiled"] button[title^="Create a new board"]:hover,
  html[data-layout-variant="tiled"] button[type="submit"]:hover {
    background: var(--n8n-orange-hover) !important;
    border-color: var(--n8n-orange-hover) !important;
  }

  html[data-layout-variant="tiled"] #app-sidebar button,
  html[data-layout-variant="tiled"] button[aria-label="Open navigation"],
  html[data-layout-variant="tiled"] button[aria-label="Close navigation"],
  html[data-layout-variant="tiled"] button[aria-label="Collapse"],
  html[data-layout-variant="tiled"] button[aria-label="Switch theme"],
  html[data-layout-variant="tiled"] button[aria-label="Switch language"],
  html[data-layout-variant="tiled"] button[title^="Board settings"],
  html[data-layout-variant="tiled"] button[title^="Reload the board"],
  html[data-layout-variant="tiled"] button[title^="Clear all active filters"],
  html[data-layout-variant="tiled"] button[title^="Wake the dispatcher"] {
    background: transparent !important;
    border-color: var(--n8n-border) !important;
    color: rgba(244, 244, 245, 0.74) !important;
    box-shadow: none !important;
  }

  html[data-layout-variant="tiled"] button[title^="Board settings"],
  html[data-layout-variant="tiled"] button[title^="Reload the board"],
  html[data-layout-variant="tiled"] button[title^="Clear all active filters"],
  html[data-layout-variant="tiled"] button[title^="Wake the dispatcher"] {
    background: #2b2b2b !important;
  }

  html[data-layout-variant="tiled"] #app-sidebar button:hover,
  html[data-layout-variant="tiled"] button[aria-label="Open navigation"]:hover,
  html[data-layout-variant="tiled"] button[aria-label="Close navigation"]:hover,
  html[data-layout-variant="tiled"] button[aria-label="Collapse"]:hover,
  html[data-layout-variant="tiled"] button[aria-label="Switch theme"]:hover,
  html[data-layout-variant="tiled"] button[aria-label="Switch language"]:hover,
  html[data-layout-variant="tiled"] button[title^="Board settings"]:hover,
  html[data-layout-variant="tiled"] button[title^="Reload the board"]:hover,
  html[data-layout-variant="tiled"] button[title^="Clear all active filters"]:hover,
  html[data-layout-variant="tiled"] button[title^="Wake the dispatcher"]:hover {
    background: rgba(255, 255, 255, 0.07) !important;
    color: var(--n8n-text) !important;
  }

  html[data-layout-variant="tiled"] button[role="checkbox"],
  html[data-layout-variant="tiled"] [role="checkbox"].peer,
  html[data-layout-variant="tiled"] .hermes-kanban-col-check,
  html[data-layout-variant="tiled"] .hermes-kanban-card-check {
    background: #181818 !important;
    border-color: var(--n8n-border-strong) !important;
    color: var(--n8n-text) !important;
    box-shadow: none !important;
  }

  html[data-layout-variant="tiled"] button[role="checkbox"][data-state="checked"],
  html[data-layout-variant="tiled"] [role="checkbox"][aria-checked="true"],
  html[data-layout-variant="tiled"] [role="checkbox"][data-state="checked"] {
    background: var(--n8n-orange) !important;
    border-color: var(--n8n-orange) !important;
    color: #1a1008 !important;
  }

  html[data-layout-variant="tiled"] button:not([class*="bg-midground"]):not([class*="bg-primary"]):not(.hermes-kanban-view-toggle-btn--active):hover,
  html[data-layout-variant="tiled"] [role="button"]:hover {
    background-color: rgba(255, 255, 255, 0.055) !important;
    border-color: rgba(181, 174, 196, 0.5) !important;
  }

  html[data-layout-variant="tiled"] input,
  html[data-layout-variant="tiled"] textarea,
  html[data-layout-variant="tiled"] select {
    min-height: 2.25rem;
    border-radius: 8px !important;
  }

  html[data-layout-variant="tiled"] input::placeholder,
  html[data-layout-variant="tiled"] textarea::placeholder {
    color: rgba(169, 162, 183, 0.62) !important;
  }

  html[data-layout-variant="tiled"] label,
  html[data-layout-variant="tiled"] [class*="uppercase"] {
    letter-spacing: 0.08em !important;
  }

  html[data-layout-variant="tiled"] table,
  html[data-layout-variant="tiled"] [role="table"] {
    background: rgba(11, 7, 19, 0.38);
    border-color: var(--n8n-border) !important;
  }

  html[data-layout-variant="tiled"] thead,
  html[data-layout-variant="tiled"] [role="rowgroup"]:first-child {
    background: rgba(255, 255, 255, 0.055) !important;
    color: #fff9f5;
  }

  html[data-layout-variant="tiled"] tr,
  html[data-layout-variant="tiled"] [role="row"] {
    border-color: rgba(154, 147, 171, 0.18) !important;
  }

  html[data-layout-variant="tiled"] tbody tr:hover,
  html[data-layout-variant="tiled"] [role="row"]:hover {
    background: rgba(255, 255, 255, 0.055) !important;
  }

  html[data-layout-variant="tiled"] code,
  html[data-layout-variant="tiled"] kbd,
  html[data-layout-variant="tiled"] pre {
    background: rgba(5, 3, 9, 0.62) !important;
    color: #f8efff !important;
    border-color: rgba(154, 147, 171, 0.24) !important;
  }

  html[data-layout-variant="tiled"] [data-slot="dialog-content"],
  html[data-layout-variant="tiled"] [data-slot="dialog-overlay"] + *,
  html[data-layout-variant="tiled"] [role="dialog"] {
    border-radius: 12px !important;
  }

  html[data-layout-variant="tiled"] [data-slot="dialog-content"],
  html[data-layout-variant="tiled"] [role="dialog"] {
    background: #242424 !important;
  }

  html[data-layout-variant="tiled"] [data-slot="dialog-header"],
  html[data-layout-variant="tiled"] [data-slot="dialog-footer"] {
    border-color: var(--n8n-border) !important;
  }

  html[data-layout-variant="tiled"] [role="listbox"] [role="option"],
  html[data-layout-variant="tiled"] [role="menu"] [role="menuitem"] {
    border-radius: 8px;
    margin: 2px;
  }

  html[data-layout-variant="tiled"] [data-state="checked"],
  html[data-layout-variant="tiled"] [aria-checked="true"] {
    border-color: rgba(255, 109, 0, 0.58) !important;
    background-color: rgba(255, 109, 0, 0.08) !important;
  }

  html[data-layout-variant="tiled"] [class*="text-success"],
  html[data-layout-variant="tiled"] [class*="text-emerald"] {
    color: var(--n8n-green) !important;
  }

  html[data-layout-variant="tiled"] [class*="text-warning"],
  html[data-layout-variant="tiled"] [class*="text-amber"] {
    color: var(--n8n-orange, #ffb84d) !important;
  }

  html[data-layout-variant="tiled"] [class*="text-destructive"],
  html[data-layout-variant="tiled"] [class*="text-red"] {
    color: #ff6476 !important;
  }

  html[data-layout-variant="tiled"] [class*="bg-success"],
  html[data-layout-variant="tiled"] [class*="bg-emerald"] {
    background-color: rgba(0, 200, 83, 0.14) !important;
    border-color: rgba(0, 200, 83, 0.36) !important;
  }

  html[data-layout-variant="tiled"] [class*="bg-warning"],
  html[data-layout-variant="tiled"] [class*="bg-amber"] {
    background-color: rgba(255, 184, 77, 0.14) !important;
    border-color: rgba(255, 184, 77, 0.36) !important;
  }

  html[data-layout-variant="tiled"] [class*="bg-destructive"],
  html[data-layout-variant="tiled"] [class*="bg-red"] {
    background-color: rgba(255, 78, 97, 0.14) !important;
    border-color: rgba(255, 78, 97, 0.38) !important;
  }

  html[data-layout-variant="tiled"] .xterm,
  html[data-layout-variant="tiled"] .xterm-viewport,
  html[data-layout-variant="tiled"] .xterm-screen {
    background: #111111 !important;
  }

  html[data-layout-variant="tiled"] .hermes-kanban-flow-header {
    background: #181818 !important;
    border-color: var(--n8n-border) !important;
  }

  html[data-layout-variant="tiled"] .hermes-kanban-flow-toolbar button {
    background: #242424 !important;
  }

  html[data-layout-variant="tiled"] .hermes-kanban-flow-status-btn {
    background: transparent !important;
    box-shadow: none !important;
  }

  html[data-layout-variant="tiled"] .hermes-kanban-flow-status-btn--active {
    background: #2b2b2b !important;
    border-color: rgba(255, 109, 0, 0.48) !important;
    color: var(--n8n-orange) !important;
  }

  html[data-layout-variant="tiled"] .hermes-kanban-view-toggle-btn--active {
    background: #2b2b2b !important;
    border-color: rgba(255, 109, 0, 0.56) !important;
    color: var(--n8n-orange) !important;
    box-shadow: inset 0 -2px 0 var(--n8n-orange) !important;
  }

  .hermes-kanban-flow-wire--running {
    stroke: var(--n8n-orange) !important;
    filter: none !important;
  }

  ::selection {
    background: rgba(255, 109, 0, 0.34);
    color: #fff;
  }
